name: Build ОСЭК-Remastered for Windows

on:
  push:
    tags: ['OSEK-v0.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt py2exe==0.14.2.0 pywin32==312
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $version = (Get-Content -LiteralPath 'web/version.txt' -Raw).Trim()
          if ($version -notmatch '^[1-9][0-9]*$') { throw 'Invalid app version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "OSEK-v0.$version") {
            throw 'Release tag must match web/version.txt'
          }
          python tools/build_py2exe.py 'dist/ОСЭК-Remastered'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath 'dist/ОСЭК-Remastered/ОСЭК-Remastered.exe')) { throw 'Executable missing' }
          $check = Start-Process -FilePath 'dist/ОСЭК-Remastered/ОСЭК-Remastered.exe' -ArgumentList '--packaging-check' -PassThru -WindowStyle Hidden
          if (!$check.WaitForExit(30000)) { throw 'Packaged application self-test timed out' }
          if ($check.ExitCode -ne 0) {
            Get-Content -LiteralPath 'dist/ОСЭК-Remastered/_internal/packaging-check.log' -ErrorAction SilentlyContinue
            throw "Packaged application self-test failed: $($check.ExitCode)"
          }
          Compress-Archive -Path 'dist/ОСЭК-Remastered' -DestinationPath "dist/OSEK-Remastered-v0.$version.zip" -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSEK-Remastered-Windows
          path: dist/OSEK-Remastered-v0.*.zip
      - name: Publish versioned release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'OSEK-v0.')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'web/version.txt' -Raw).Trim()
          $notesFile = Join-Path $env:RUNNER_TEMP 'osek-release-notes.md'
          @'
          ## Изменения

          > [!NOTE]
          > Большинство функций работают стабильно и надлежащим образом.
          > Некоторые функции могут отсутствовать.

          > [!WARNING]
          > Это неофициальный клиент [Открытого социально-экономического колледжа](https://sdo.i-spo.ru). Приложение создано без согласования с администрацией колледжа, не имеет к ней отношения и её одобрения. Вы используете его на свой страх и риск, соблюдая при этом правила колледжа. В работе приложения возможны ошибки.

          **[VIRUSTOTAL-OSEK-Remastered-v0.VERSION.zip]()** `0/0` SHA256:
          '@.Replace('VERSION', $version) | Set-Content -LiteralPath $notesFile -Encoding utf8
          gh release create $env:GITHUB_REF_NAME "dist/OSEK-Remastered-v0.$version.zip" --verify-tag --title "ОСЭК-Remastered-v0.$version" --notes-file $notesFile
