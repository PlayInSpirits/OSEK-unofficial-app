name: Build ОСЭК-Remastered for Windows

on:
  push:
    tags: ['OSEK-v0.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'web/version.txt' -Raw).Trim()
          if ($version -notmatch '^[1-9][0-9]*$') { throw 'Invalid app version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "OSEK-v0.$version") {
            throw 'Release tag must match web/version.txt'
          }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx --name ОСЭК-Remastered --icon assets/icon.ico --add-data "web:web" --add-data "assets/icon.png:assets" --collect-all webview --collect-all pypdfium2 --collect-all pypdfium2_raw --hidden-import clr --hidden-import webview.platforms.edgechromium run.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath 'dist/ОСЭК-Remastered/ОСЭК-Remastered.exe')) { throw 'Executable missing' }
          Get-FileHash -Algorithm SHA256 -LiteralPath 'dist/ОСЭК-Remastered/ОСЭК-Remastered.exe' | ForEach-Object { "$($_.Hash.ToLower())  ОСЭК-Remastered.exe" } | Set-Content -Encoding utf8 'dist/SHA256.txt'
          Compress-Archive -Path 'dist/ОСЭК-Remastered' -DestinationPath 'dist/OSEK-Remastered-Windows.zip' -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSEK-Remastered-Windows
          path: |
            dist/OSEK-Remastered-Windows.zip
            dist/SHA256.txt
      - name: Publish versioned release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'OSEK-v0.')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME 'dist/OSEK-Remastered-Windows.zip' 'dist/SHA256.txt' --verify-tag --title "ОСЭК-Remastered $env:GITHUB_REF_NAME" --notes=
